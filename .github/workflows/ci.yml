name: Tests

on:
  push:
  workflow_dispatch:

# The whole suite shares one pool of EventHub accounts, and `DELETE /bookings`
# is account-scoped — so two runs sharing an account could destroy each other's
# bookings mid-flight. The key is deliberately CONSTANT (no github.ref), because
# the pool is a single global resource: a per-branch group would serialise
# nothing. `cancel-in-progress: false` because cancelling a run mid-flight kills
# it between creating bookings and tearing them down, leaving exactly the litter
# this lock exists to prevent. Queue, never cancel.
# See docs/adr/0008-test-account-strategy.md
concurrency:
  group: eventhub-shared-account-pool
  cancel-in-progress: false

# Least privilege: the workflow only needs to read the repository. It does not
# write to the repo, create releases, or comment on pull requests.
permissions:
  contents: read

jobs:
  test:
    name: UI + API suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Non-sensitive configuration comes from repository *variables*.
      # Unset variables expand to an empty string, which src/config/env.ts
      # deliberately treats as "absent" rather than as an invalid URL.
      BASE_URL: ${{ vars.BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      # Credentials come from repository *secrets* and are injected only here.
      # They are never echoed; GitHub masks them in logs, and our logger redacts
      # tokens and passwords before anything reaches stdout (ADR 0006 / 0007).
      TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
      TEST_USER_A_PASSWORD: ${{ secrets.TEST_USER_A_PASSWORD }}
      TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
      TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
      TEST_USER_C_EMAIL: ${{ secrets.TEST_USER_C_EMAIL }}
      TEST_USER_C_PASSWORD: ${{ secrets.TEST_USER_C_PASSWORD }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pinned by .nvmrc so CI and a developer laptop run the same runtime.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # `npm ci` installs strictly from package-lock.json and fails if the
        # lock and package.json have drifted. `npm install` would silently
        # rewrite the lock, so a green pipeline would not prove what it ran.
        run: npm ci

      - name: Install Chromium
        # Only the browser the suite actually uses. `--with-deps` adds the system
        # libraries Chromium needs on a bare runner.
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        # No `continue-on-error`: a failing suite must fail the job. Artifacts are
        # still uploaded, because the steps below run with `if: always()`.
        run: npm test

      - name: Build the Allure report
        # Single self-contained HTML file — a far better artifact than a directory
        # of hashed chunks. Allure 3 is pure Node, so no JRE is needed (ADR 0003).
        if: always()
        run: npm run allure:single

      - name: Summarise the run
        if: always()
        run: node .github/scripts/summarise.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          # Bounded exposure: traces and videos can contain auth headers and
          # typed form data, and artifacts on a public repository are
          # downloadable (ADR 0007).
          retention-days: 7

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/index.html
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test-results/junit.xml
          retention-days: 7
