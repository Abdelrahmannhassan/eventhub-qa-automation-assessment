name: Tests

on:
  push:
  workflow_dispatch:

# The whole workflow shares one pool of EventHub accounts, and `DELETE /bookings`
# is account-scoped — so two runs sharing an account could destroy each other's
# bookings mid-flight. The key is deliberately CONSTANT (no github.ref), because
# the pool is a single global resource: a per-branch group would serialise
# nothing. `cancel-in-progress: false` because cancelling a run mid-flight kills
# it between creating bookings and tearing them down, leaving exactly the litter
# this lock exists to prevent. Queue, never cancel.
# See docs/adr/0008-test-account-strategy.md
concurrency:
  group: eventhub-shared-account-pool
  cancel-in-progress: false

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

env:
  # Non-sensitive configuration comes from repository *variables*. An unset
  # variable expands to an empty string, which src/config/env.ts deliberately
  # treats as "absent" rather than as an invalid URL.
  BASE_URL: ${{ vars.BASE_URL }}
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  # Credentials come from repository *secrets*. They are never echoed; GitHub
  # masks them, and our logger redacts tokens and passwords before anything
  # reaches stdout (ADR 0006 / 0007).
  TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
  TEST_USER_A_PASSWORD: ${{ secrets.TEST_USER_A_PASSWORD }}
  TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
  TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
  TEST_USER_C_EMAIL: ${{ secrets.TEST_USER_C_EMAIL }}
  TEST_USER_C_PASSWORD: ${{ secrets.TEST_USER_C_PASSWORD }}

jobs:
  # ---------------------------------------------------------------------------
  # The regression gate. Excludes @known-defect tests so a documented product
  # defect cannot mask a genuine regression. See ADR 0010.
  # ---------------------------------------------------------------------------
  test:
    name: UI + API suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pinned by .nvmrc so CI and a developer laptop run the same runtime.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # `npm ci` installs strictly from package-lock.json and fails if the lock
        # and package.json have drifted. `npm install` would silently rewrite the
        # lock, so a green pipeline would not prove what it ran.
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        # `npm test` is `playwright test --grep-invert @known-defect`.
        run: npm test

      - name: Build the Allure report
        # Single self-contained HTML file. Allure 3 is pure Node — no JRE needed.
        if: always()
        run: npm run allure:single

      - name: Summarise the run
        if: always()
        run: node .github/scripts/summarise.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          # Bounded exposure: traces and videos can carry auth headers and typed
          # form data, and artifacts on a public repository are downloadable
          # (ADR 0007).
          retention-days: 7

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/index.html
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test-results/junit.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Known defects. These tests assert the CORRECT behaviour and are expected to
  # fail while the product is broken, so this job reports rather than gates.
  #
  # `needs: test` is NOT about ordering preference — it serialises account-pool
  # use. Two jobs running in parallel would both act as the same pooled accounts,
  # which is exactly the interference the workflow-level lock prevents between
  # runs. `if: always()` so the defect is still reported when the gate fails.
  # See docs/adr/0010-known-defect-quarantine.md
  # ---------------------------------------------------------------------------
  known-defects:
    name: Known defects (reporting only)
    runs-on: ubuntu-latest
    needs: test
    if: always()
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run known-defect tests
        # Reports, never gates: `continue-on-error` on the job means a reproduced
        # defect does not fail the workflow, while a regression in the gate above
        # still does.
        continue-on-error: true
        run: npm run test:known-defects

      - name: Build the Allure report
        if: always()
        run: npm run allure:single

      - name: Summarise the known defects
        if: always()
        run: node .github/scripts/summarise-known-defects.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload known-defect reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: known-defects-report
          path: |
            playwright-report/
            allure-report/index.html
            test-results/junit.xml
          retention-days: 7
